<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biodata Siswa & Guru</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #eef2f7;
      --kartu: #ffffff;
      --teks: #14213d;
      --teks-redup: #5b667a;
      --garis: #d6dde8;
      --aksen: #1d4ed8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--teks);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif; line-height: 1.5;
    }
    .wadah { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    header h1 { margin: 0; font-size: 1.75rem; font-weight: 800; }
    header p  { margin: 0; color: var(--teks-redup); }
    
    .btn-tambah {
      background: var(--aksen); color: #fff; border: none; padding: 10px 18px;
      border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.95rem;
    }
    .btn-tambah:hover { opacity: 0.9; }

    /* Modal / Popup Form */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; padding: 16px;
    }
    .modal-konten {
      background: #ffffff; color: #14213d; padding: 24px; border-radius: 14px; width: 100%; max-width: 450px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25); position: relative; border: 1px solid var(--garis);
    }
    .modal-konten h3 { margin-top: 0; color: #14213d; }
    .close-btn { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #5b667a; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: #14213d; }
    .form-group input, .form-group select {
      width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; color: #14213d; font: inherit;
    }
    .btn-submit {
      width: 100%; background: var(--aksen); color: #fff; border: none; padding: 10px;
      border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 8px;
    }

    /* Kontrol & Filter */
    .kontrol { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0 8px; }
    .kontrol input, .kontrol select {
      font: inherit; color: var(--teks); background: var(--kartu);
      border: 1px solid var(--garis); border-radius: 10px; padding: 10px 12px;
    }
    .kontrol input  { flex: 1 1 220px; }
    .kontrol select { flex: 0 1 160px; }
    .jumlah { color: var(--teks-redup); font-size: 0.9rem; margin: 0 0 16px; }
    
    .daftar {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px;
    }
    .kartu {
      background: var(--kartu); border: 1px solid var(--garis); border-radius: 14px; overflow: hidden;
    }
    .pita { height: 56px; background: hsl(var(--hue) 65% 45%); }
    .isi  { padding: 0 16px 16px; text-align: center; }
    .foto {
      width: 76px; height: 76px; margin: -38px auto 8px; border-radius: 50%;
      border: 4px solid var(--kartu); background: hsl(var(--hue) 55% 88%);
      color: hsl(var(--hue) 65% 28%); display: grid; place-items: center;
      font-weight: 800; font-size: 1.5rem; overflow: hidden;
    }
    .foto img { width: 100%; height: 100%; object-fit: cover; }
    .nama { margin: 0; font-size: 1.05rem; font-weight: 800; }
    .nis  { margin: 0 0 12px; color: var(--teks-redup); font-size: 0.85rem; }
    .rincian { margin: 0; text-align: left; font-size: 0.9rem; }
    .rincian div {
      display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--garis);
    }
    .rincian dt { color: var(--teks-redup); }
    .rincian dd { margin: 0; font-weight: 600; text-align: right; }
    
    .pesan { grid-column: 1 / -1; text-align: center; padding: 40px 16px; color: var(--teks-redup); }
  </style>
</head>
<body>
  <div class="wadah">
    <header>
      <div>
        <h1>Biodata Sekolah</h1>
        <p>Cari data siswa atau guru.</p>
      </div>
      <button class="btn-tambah" onclick="bukaModal()">+ Tambah Data</button>
    </header>

    <!-- MODAL POPUP FORM TAMBAH -->
    <div id="modalTambah" class="modal">
      <div class="modal-konten">
        <button class="close-btn" onclick="tutupModal()">&times;</button>
        <h3>Tambah Data Baru</h3>
        
        <div class="form-group">
          <label>Pilih Kategori:</label>
          <select id="pilihKategori" onchange="gantiForm()">
            <option value="siswa">Siswa</option>
            <option value="guru">Guru</option>
          </select>
        </div>

        <!-- FORM SISWA -->
        <form id="formSiswa" onsubmit="simpanSiswa(event)">
          <div class="form-group">
            <label>Nomor Induk Siswa (NIS)</label>
            <input type="text" id="nis" required>
          </div>
          <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="namaSiswa" required>
          </div>
          <div class="form-group">
            <label>Kelas</label>
            <input type="text" id="kelas" required placeholder="Contoh: TKJ">
          </div>
          <div class="form-group">
            <label>Jenis Kelamin</label>
            <select id="jk">
              <option value="Laki-laki">Laki-laki</option>
              <option value="Perempuan">Perempuan</option>
            </select>
          </div>
          <button type="submit" class="btn-submit">Simpan Siswa</button>
        </form>

        <!-- FORM GURU -->
        <form id="formGuru" style="display: none;" onsubmit="simpanGuru(event)">
          <div class="form-group">
            <label>NIP (Nomor Induk Pegawai)</label>
            <input type="text" id="nip" required>
          </div>
          <div class="form-group">
            <label>Nama Lengkap & Gelar</label>
            <input type="text" id="namaGuru" required>
          </div>
          <div class="form-group">
            <label>Mata Pelajaran</label>
            <input type="text" id="mapel" required placeholder="Contoh: Matematika">
          </div>
          <button type="submit" class="btn-submit">Simpan Guru</button>
        </form>
      </div>
    </div>

    <div class="kontrol">
      <input id="cari" type="search" placeholder="Cari nama, NIS, atau NIP">
      <select id="filterKelas">
        <option value="">Semua Kategori / Kelas</option>
      </select>
    </div>
    <p id="jumlah" class="jumlah"></p>
    <main id="daftar" class="daftar"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  
  <script>
    const SUPABASE_URL = "https://ssjelbwucvvmqlkjijnn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_YJbBWOWvA7mBowt8Vt3Tiw_qo4WpCO4";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let semuaData = [];

    function bukaModal() { document.getElementById("modalTambah").style.display = "flex"; }
    function tutupModal() { document.getElementById("modalTambah").style.display = "none"; }

    function gantiForm() {
      const kategori = document.getElementById("pilihKategori").value;
      if (kategori === "siswa") {
        document.getElementById("formSiswa").style.display = "block";
        document.getElementById("formGuru").style.display = "none";
      } else {
        document.getElementById("formSiswa").style.display = "none";
        document.getElementById("formGuru").style.display = "block";
      }
    }

    async function muatData() {
      const { data: siswa } = await db.from("siswa").select("nis, nama, kelas, jenis_kelamin").order("nama");
      const { data: guru } = await db.from("guru").select("nip, nama, mapel").order("nama");

      semuaData = [
        ...(siswa || []).map(s => ({ ...s, tipe: 'Siswa', idUnik: s.nis })),
        ...(guru || []).map(g => ({ ...g, tipe: 'Guru', idUnik: g.nip, kelas: 'Mapel: ' + g.mapel, jenis_kelamin: g.mapel }))
      ];

      tampilkanData();
    }

    async function simpanSiswa(e) {
      e.preventDefault();
      const { error } = await db.from("siswa").insert([{
        nis: document.getElementById("nis").value,
        nama: document.getElementById("namaSiswa").value,
        kelas: document.getElementById("kelas").value,
        jenis_kelamin: document.getElementById("jk").value
      }]);

      if (error) alert("Gagal: " + error.message);
      else {
        alert("Berhasil menambah siswa!");
        tutupModal();
        muatData();
      }
    }
